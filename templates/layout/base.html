<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %} Modern Dashboard - Admin Panel {% endblock %}</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- ApexCharts CSS/JS -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

  <style>
    :root {
      --bs-font-sans-serif: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      --sidebar-width: 260px;
      --bg-body: #f8fafc;
      --card-border: #f1f5f9;
      --card-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.03), 0 1px 2px -1px rgba(15, 23, 42, 0.03);
      --hover-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.03);
    }

    body {
      font-family: var(--bs-font-sans-serif);
      background-color: var(--bg-body);
      color: #1e293b;
      min-height: 100vh;
    }

    /* Sidebar Refinements */
    .sidebar {
      width: var(--sidebar-width);
      min-height: 100vh;
      background-color: #ffffff;
      border-right: 1px solid #e2e8f0;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
      transition: all 0.3s ease;
    }

    .nav-link {
      color: #64748b;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.625rem 0.875rem;
      border-radius: 0.5rem;
      transition: all 0.15s ease-in-out;
    }

    .nav-link:hover {
      color: #0f172a;
      background-color: #f1f5f9;
    }

    .nav-link.active {
      color: #6366f1;
      background-color: #eeeef2;
    }

    /* Main Content Layout */
    .main-wrapper {
      margin-left: var(--sidebar-width);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navbar */
    .top-navbar {
      height: 64px;
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 0 1.5rem;
    }

    /* Card Styling */
    .card-custom {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      box-shadow: var(--card-shadow);
      transition: all 0.2s ease;
    }

    .card-custom:hover {
      box-shadow: var(--hover-shadow);
    }

    /* Icon Badges */
    .icon-badge {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    /* Custom Status Pills */
    .badge-soft-success {
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }
    .badge-soft-warning {
      background: #fef9c3;
      color: #a16207;
      border: 1px solid #fef08a;
    }
    .badge-soft-danger {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }

    /* Table Enhancements */
    .table > :not(caption) > * > * {
      padding: 0.875rem 1rem;
      border-bottom-color: #f1f5f9;
    }
  </style>
</head>
<body>

  <!-- Sidebar Block -->
  {% block sidebar %}
  <aside class="sidebar d-flex flex-column p-3">
    <!-- Brand Logo -->
    <a href="/" class="d-flex align-items-center gap-2 px-2 py-1 mb-3 text-decoration-none">
      <div class="bg-primary text-white rounded-3 d-flex align-items-center justify-content-center" style="width: 36px; height: 36px; background: linear-gradient(135deg, #6366f1, #4f46e5) !important;">
        <i class="bi bi-layers-fill fs-5"></i>
      </div>
      <span class="fs-5 fw-bold text-dark tracking-tight">NexusDash</span>
    </a>

    <div class="text-uppercase text-muted fw-bold mb-2 px-2" style="font-size: 0.6875rem; letter-spacing: 0.05em">
      Menu
    </div>

    <!-- Navigation Links -->
    <ul class="nav nav-pills flex-column gap-1 mb-auto">
      <li class="nav-item">
        <a href="#" class="nav-link active d-flex align-items-center gap-2">
          <i class="bi bi-grid-1x2-fill"></i> Overview
        </a>
      </li>
      <li>
        <a href="#" class="nav-link d-flex align-items-center gap-2">
          <i class="bi bi-table"></i> Category
        </a>
      </li>
      <li>
        <a href="#" class="nav-link d-flex align-items-center gap-2">
          <i class="bi bi-box-seam"></i> Products
        </a>
      </li>
      <li>
        <a href="#" class="nav-link d-flex align-items-center gap-2">
          <i class="bi bi-people"></i> Users
        </a>
      </li>
    </ul>

    <hr class="my-2 text-muted opacity-25" />

    <!-- User Profile Dropdown -->
    <div class="dropdown">
      <a href="#" class="d-flex align-items-center text-decoration-none text-dark p-1 rounded-2 dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
        <img src="https://i.pravatar.cc/80?img=12" alt="avatar" width="36" height="36" class="rounded-circle me-2 border" />
        <div class="lh-1 me-auto">
          <strong class="d-block text-truncate" style="max-width: 130px; font-size: 0.875rem">Alex Morgan</strong>
          <small class="text-muted" style="font-size: 0.75rem">alex@nexus.io</small>
        </div>
      </a>
      <ul class="dropdown-menu shadow-sm border-0">
        <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
        <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Settings</a></li>
        <li><hr class="dropdown-divider" /></li>
        <li><a class="dropdown-item text-danger" href="#"><i class="bi bi-box-arrow-right me-2"></i>Sign out</a></li>
      </ul>
    </div>
  </aside>
  {% endblock %}

  <!-- Main Content Area -->
  <div class="main-wrapper">
    <!-- Top Navbar -->
    <header class="top-navbar d-flex align-items-center justify-content-end sticky-top">
      <!-- Quick Actions (Icons moved to right) -->
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-light rounded-circle p-2 d-flex align-items-center justify-content-center position-relative" style="width: 38px; height: 38px">
          <i class="bi bi-bell text-secondary"></i>
          <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
        </button>
        <button class="btn btn-light rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 38px; height: 38px">
          <i class="bi bi-moon-stars text-secondary"></i>
        </button>
      </div>
    </header>

    <!-- Main Body Container -->
    <main class="p-4 flex-grow-1">
      {% block content %}
      <!-- Category List Content (Replaced based on provided image layout) -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 fw-bold mb-0">Category List</h1>
        <button class="btn btn-primary d-flex align-items-center gap-2 fw-semibold px-4" style="background-color: #0d6efd; border: none; border-radius: 8px">
            +Add New category
        </button>
      </div>

      <div class="card-custom">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead class="bg-light">
              <tr class="text-muted fs-7 text-uppercase">
                <th scope="col" style="width: 10%">No.</th>
                <th scope="col" style="width: 40%">Category Name</th>
                <th scope="col" style="width: 25%">Status</th>
                <th scope="col" style="width: 25%">Action</th>
              </tr>
            </thead>
            <tbody class="fs-7">
              <tr>
                <td class="text-dark">1</td>
                <td class="text-dark">Electronics</td>
                <td class="text-dark">Active</td>
                <td>
                  <div class="d-flex gap-2">
                    <button class="btn btn-sm text-dark px-3" style="background-color: #ffc107; border-radius: 5px;">Edit</button>
                    <button class="btn btn-sm btn-danger px-3" style="border-radius: 5px;">Delete</button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      {% endblock %}
    </main>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
