{% extends 'layout/base.html' %}

{% block title %} Product List {% endblock %}

{% block content %}
    <div class="w-100 py-4">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
            <h1 class="h4 card-title mb-0 fw-bold">Create New Product</h1>
        </div>
        <div class="card-body p-4">
            <form method="POST" action="">
                <div class="mb-3">
                    <label class="form-label fw-medium">Product Name</label>
                    <input type="text" class="form-control" name="name" placeholder="e.g. ASUS, DELL, MAC,...">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Product Price</label>
                    <input type="number" class="form-control" name="price" placeholder="0.0$">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Product Stock</label>
                    <input type="number" class="form-control" name="stock" placeholder="0">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Product Image</label>
                    <input type="file" class="form-control" name="image">
                </div>

                <div class="d-flex justify-content-start gap-2">
                    <button type="submit" class="btn btn-primary px-4">Save</button>
                    <a href="{{url_for('index_product')}}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
