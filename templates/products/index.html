{% extends 'layout/base.html' %}

{% block title %}Products List{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="fw-bold">Products List</h1>
        <a href="{{ url_for('create_product') }}" class="btn btn-primary">+Add New Product</a>
    </div>
    <hr>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        {% for pro in products %}
            <div class="col">
                <div class="card shadow-sm h-100">
                    <img src="{{ url_for('static', filename='uploads/products/' + (pro.image or 'default.jpg')) }}"
                         class="card-img-top img-fluid"
                         alt="{{ pro.name }}"
                         style="height: 200px; object-fit: cover; width: 100%;">

                    <!-- Product Details -->
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold text-dark mb-1">{{ pro.name }}</h5>

                        <div class="d-flex justify-content-between align-items-center my-2">
                            <span class="fs-5 fw-bold text-primary">${{ pro.price }}</span>
                            <span class="badge bg-secondary-subtle text-secondary border">Stock: {{ pro.stock }}</span>
                        </div>

                        <!-- Action Buttons -->
                        <div class="mt-auto pt-3 d-flex gap-2">
                            <a href="{{ url_for('update_product', id=pro['id']) }}" class="btn btn-outline-primary w-50">EDIT</a>
                            <form action="{{ url_for('delete_product', id=pro['id']) }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this product?');">
                                <button type="submit" class="btn btn-danger">DELETE</button>
                            </form>
                        </div> 
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
