{% extends 'layout/base.html' %}


{% block title %}Category List{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="fw-bold">Products List</h1>
        <a href="{{url_for('create_product')}}" class="btn btn-primary">+Add New Product</a>
    </div>
    <hr>

    <div class="card shadow-sm h-100" style="max-width: 18rem;">
        <!-- Product Image -->
        <img src="https://i.pinimg.com/1200x/70/36/23/703623a3616299c9c081aa621b4cec08.jpg" class="card-img-top img-fluid" alt="ASUS Laptop">

        <!-- Product Details -->
        <div class="card-body d-flex flex-column">
            <h5 class="card-title fw-bold text-dark mb-1">ASUS</h5>

            <div class="d-flex justify-content-between align-items-center my-2">
            <span class="fs-4 fw-bold text-primary">$1,000</span>
            <span class="badge bg-secondary-subtle text-secondary border">Stock: 20</span>
            </div>

            <!-- Action Buttons -->
            <div class="mt-auto pt-3 d-flex gap-2">
            <a href="#" class="btn btn-outline-primary btn-sm w-50">EDIT</a>
            <a href="#" class="btn btn-outline-danger btn-sm w-50">DELETE</a>
            </div>
        </div>
    </div>
{% endblock %}
