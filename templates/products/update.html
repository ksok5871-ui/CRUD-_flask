{% extends 'layout/base.html' %}

{% block title %} Product List {% endblock %}

{% block content %}
    <div class="w-100 py-4">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
            <h1 class="h4 card-title mb-0 fw-bold">Create New Product</h1>
        </div>
        <div class="card-body p-4">
            <form method="POST" action="{{url_for('update_product', id=product.id)}}" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-medium">Product Name</label>
                    <input type="text" class="form-control" name="name" value="{{product.name}}">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Product Price</label>
                    <input type="number" class="form-control" name="price" value="{{product.price}}">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Product Stock</label>
                    <input type="number" class="form-control" name="stock" value="{{product.stock}}">
                </div>
                <div class="row align-items-center mb-4">
                    <!-- File Upload Input -->
                    <div class="col-md-9 mb-3 mb-md-0">
                        <label class="form-label fw-medium">Product Image</label>
                        <input type="file" class="form-control" name="image">
                        <div class="form-text">Leave blank if you don't want to change the image.</div>
                    </div>

                    <!-- Current Image Preview -->
                    <div class="col-md-3 text-center text-md-start">
                        {% if product['image'] %}
                            <label class="form-label fw-medium d-block">Current</label>
                            <img src="{{ url_for('static', filename='uploads/products/' + product['image']) }}"
                                class="rounded border shadow-sm"
                                style="width: 70px; height: 70px; object-fit: cover;"
                                alt="Product Image">
                        {% else %}
                            <span class="text-muted small">No image uploaded</span>
                        {% endif %}
                    </div>
                </div>

                <div class="d-flex justify-content-start gap-2">
                    <button type="submit" class="btn btn-primary px-4">Save</button>
                    <a href="{{url_for('index_product')}}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
